<div class="dashboard-container">
  <!-- Dashboard Header -->
  <header class="dashboard-header">
    <div class="header-content">
      <h1 class="dashboard-title">Analytics Dashboard</h1>
      <p class="dashboard-subtitle">Image Processing Performance Metrics</p>
    </div>
    <div class="header-stats">
      <div class="stat-card">
        <div class="stat-value">{{totalProcessed}}</div>
        <div class="stat-label">Total Processed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">{{successRate}}%</div>
        <div class="stat-label">Success Rate</div>
      </div>
    </div>
  </header>

  <!-- Charts Grid -->
  <div class="charts-grid">
    @for (card of cards; track card.id) {
      <div
        #chartGridItem
        class="chart-card"
        [class.chart-card-large]="card.span === 2 && !card.expanded"
        [class.chart-card-xlarge]="card.span === 3 && !card.expanded"
        [class.expanded]="card.expanded"
        [attr.data-id]="card.order"
      >
        <div class="chart-header">
          <div class="chart-heading">
            <h3 class="chart-title">{{ card.title }}</h3>
            <span class="chart-subtitle">{{ card.subtitle }}</span>
          </div>
          <button type="button" class="chart-toggle" (click)="onExpand(card)">
            {{ card.expanded ? 'Collapse' : 'Expand' }}
          </button>
        </div>
        <div class="chart-content">
          <div
            echarts
            [options]="card.option"
            class="chart-wrapper"
            [class.chart-wrapper-expanded]="card.expanded"
            (chartInit)="onChartInit(card.id, $event)"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
